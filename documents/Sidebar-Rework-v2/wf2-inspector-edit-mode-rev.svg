<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1140" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <style>
      .pg{fill:#F1F3F5}
      .panel{fill:#FFFFFF}
      .tdark{fill:#1A2733}
      .tmut{fill:#6B7785}
      .lbl{font-size:11px;fill:#6B7785;letter-spacing:.4px}
      .inp{fill:#FFFFFF;stroke:#9FB6E8;stroke-width:1.5}
      .marker{fill:#E8590C}
      .mtxt{fill:#fff;font-size:13px;font-weight:700}
      .legb{font-size:13px;fill:#1A2733;font-weight:700}
    </style>
  </defs>
  <rect class="pg" x="0" y="0" width="1400" height="1140"/>

  <!-- ===== INSPECTOR PANEL (L5 detail, edit) ===== -->
  <rect class="panel" x="40" y="40" width="780" height="1060" rx="6"/>
  <rect x="40" y="40" width="780" height="1060" rx="6" fill="none" stroke="#C9D1D8"/>

  <!-- edit banner with SOURCE-OF-TRUTH message -->
  <rect x="40" y="40" width="780" height="46" rx="6" fill="#E7F6EF"/>
  <rect x="40" y="40" width="6" height="46" fill="#1E9E6A"/>
  <text x="62" y="62" fill="#15603F" font-size="13" font-weight="700">✎ Edit mode</text>
  <text x="62" y="78" fill="#1E7A52" font-size="11.5">⟲ Saved to the single source of truth — every change applies across all tabs &amp; the whole app</text>
  <rect x="624" y="50" width="76" height="26" rx="6" fill="#fff" stroke="#BFE3D0"/><text x="638" y="67" fill="#15603F" font-size="12">Discard</text>
  <rect x="708" y="50" width="92" height="26" rx="6" fill="#1E9E6A"/><text x="722" y="67" fill="#fff" font-size="12" font-weight="700">Save</text>

  <!-- breadcrumb + level pill -->
  <text x="62" y="110" class="tmut" font-size="11">Corporate Functions ▸ Finance ▸ Accounting &amp; Close ▸ Subledger Close</text>
  <rect x="700" y="98" width="100" height="18" rx="9" fill="#EAF1FE"/><text x="712" y="111" fill="#1D4ED8" font-size="10" font-weight="700">L5 · DETAIL VIEW</text>

  <!-- title field -->
  <text x="62" y="134" class="lbl">STEP NAME</text>
  <rect class="inp" x="62" y="142" width="736" height="36" rx="6"/>
  <text x="76" y="165" class="tdark" font-size="14" font-weight="600">Validate subledger-to-GL interface postings for the period</text>

  <!-- meta chips (client language, no schema) -->
  <rect x="62" y="190" width="60" height="24" rx="12" fill="#F1F3F5"/><text x="74" y="206" fill="#5A6672" font-size="11">Task</text>
  <rect x="130" y="190" width="120" height="24" rx="12" fill="#FDF3E2"/><text x="142" y="206" fill="#C77700" font-size="11" font-weight="600">⚙ Augmented ▾</text>
  <rect x="258" y="190" width="104" height="24" rx="12" fill="#E7F6EF"/><text x="270" y="206" fill="#1E9E6A" font-size="11" font-weight="600">✓ Verified ▾</text>

  <!-- tabs (client-oriented, consistent across levels) -->
  <line x1="40" y1="240" x2="820" y2="240" stroke="#E2E6EA"/>
  <g font-size="12">
    <text x="62" y="234" class="tmut">Overview</text>
    <text x="142" y="234" class="tmut">Tasks</text>
    <text x="200" y="234" fill="#2563EB" font-weight="700">Roles</text><rect x="196" y="237" width="40" height="3" fill="#2563EB"/>
    <text x="262" y="234" class="tmut">Applications</text>
    <text x="368" y="234" class="tmut">Deliverables</text>
    <text x="470" y="234" class="tmut">Checklist</text>
    <text x="552" y="234" class="tmut">Testing</text>
  </g>
  <text x="640" y="234" class="tmut" font-size="11">— L5 shows all in detail —</text>

  <!-- ===== ROLES ===== -->
  <text x="62" y="270" class="lbl">ROLES</text>
  <rect x="610" y="256" width="188" height="26" rx="6" fill="#EAF1FE" stroke="#9FB6E8"/><text x="624" y="274" fill="#1D4ED8" font-size="11.5" font-weight="600">＋ Associate / add role</text>
  <!-- role row 1 -->
  <rect x="62" y="288" width="736" height="44" rx="8" fill="#F7FBF8" stroke="#CBEAD9"/>
  <circle cx="80" cy="310" r="4" fill="#1E9E6A"/>
  <text x="94" y="314" fill="#15603F" font-size="13" font-weight="600">Senior Accountant</text>
  <rect class="inp" x="300" y="296" width="120" height="28" rx="6"/><text x="312" y="315" class="tdark" font-size="11">Owner ▾</text>
  <rect class="inp" x="430" y="296" width="130" height="28" rx="6"/><text x="442" y="315" class="tdark" font-size="11">Accountable ▾</text>
  <text x="700" y="315" fill="#2563EB" font-size="11">↗ open</text>
  <text x="766" y="316" fill="#D1453B" font-size="15">✕</text>
  <!-- role row 2 -->
  <rect x="62" y="338" width="736" height="44" rx="8" fill="#F7FBF8" stroke="#CBEAD9"/>
  <circle cx="80" cy="360" r="4" fill="#7FC9A6"/>
  <text x="94" y="364" fill="#15603F" font-size="13" font-weight="600">Staff Accountant</text>
  <rect class="inp" x="300" y="346" width="120" height="28" rx="6"/><text x="312" y="365" class="tdark" font-size="11">Participant ▾</text>
  <rect class="inp" x="430" y="346" width="130" height="28" rx="6"/><text x="442" y="365" class="tdark" font-size="11">Consulted ▾</text>
  <text x="700" y="365" fill="#2563EB" font-size="11">↗ open</text>
  <text x="766" y="366" fill="#D1453B" font-size="15">✕</text>

  <!-- ===== APPLICATIONS ===== -->
  <text x="62" y="412" class="lbl">APPLICATIONS</text>
  <rect x="580" y="398" width="218" height="26" rx="6" fill="#EAF1FE" stroke="#9FB6E8"/><text x="594" y="416" fill="#1D4ED8" font-size="11.5" font-weight="600">＋ Associate / add application</text>
  <rect x="62" y="430" width="736" height="40" rx="8" fill="#EFF5FF" stroke="#D4E2FC"/>
  <text x="78" y="454" fill="#1D4ED8" font-size="13" font-weight="600">SAP S/4HANA (GL)</text>
  <rect class="inp" x="430" y="438" width="130" height="26" rx="6"/><text x="442" y="455" class="tdark" font-size="11">performed ▾</text>
  <text x="700" y="455" fill="#2563EB" font-size="11">↗ open</text>
  <text x="766" y="456" fill="#D1453B" font-size="15">✕</text>
  <rect x="62" y="476" width="736" height="40" rx="8" fill="#EFF5FF" stroke="#D4E2FC"/>
  <text x="78" y="500" fill="#1D4ED8" font-size="13" font-weight="600">BlackLine (Close)</text>
  <rect class="inp" x="430" y="484" width="130" height="26" rx="6"/><text x="442" y="501" class="tdark" font-size="11">memorialized ▾</text>
  <text x="700" y="501" fill="#2563EB" font-size="11">↗ open</text>
  <text x="766" y="502" fill="#D1453B" font-size="15">✕</text>

  <!-- ===== DELIVERABLE + CHECKLIST ITEMS ===== -->
  <text x="62" y="548" class="lbl">DELIVERABLE &amp; CHECKLIST</text>
  <rect x="62" y="558" width="736" height="34" rx="8" fill="#E9F7EF" stroke="#CBEAD9"/>
  <text x="78" y="580" fill="#196F3D" font-size="13" font-weight="700">Subledger Close &amp; Journal Entry Processing</text>
  <text x="700" y="580" fill="#2563EB" font-size="11">↗ open</text>
  <!-- checklist items -->
  <text x="78" y="612" class="tmut" font-size="11">CHECKLIST ITEMS</text>
  <rect x="620" y="600" width="178" height="24" rx="6" fill="#EAF1FE" stroke="#9FB6E8"/><text x="634" y="616" fill="#1D4ED8" font-size="11" font-weight="600">＋ Add checklist item</text>
  <g font-size="12">
    <rect x="62" y="624" width="736" height="32" rx="6" fill="#fff" stroke="#EAEEF1"/>
    <text x="78" y="644" fill="#1E9E6A" font-size="13">✓</text>
    <text x="98" y="644" class="tdark">Confirm AP, AR, premium &amp; investment subledgers fully posted to GL</text>
    <text x="766" y="645" fill="#D1453B" font-size="14">✕</text>
    <rect x="62" y="660" width="736" height="32" rx="6" fill="#fff" stroke="#EAEEF1"/>
    <text x="78" y="680" fill="#1E9E6A" font-size="13">✓</text>
    <text x="98" y="680" class="tdark">Verify control totals match between subledger &amp; GL clearing accounts</text>
    <text x="766" y="681" fill="#D1453B" font-size="14">✕</text>
    <!-- item being added (inline editable) -->
    <rect class="inp" x="62" y="696" width="736" height="32" rx="6"/>
    <text x="78" y="716" fill="#1E9E6A" font-size="13">✓</text>
    <text x="98" y="716" class="tmut" font-style="italic">Investigate and clear all suspense items…</text>
    <text x="780" y="716" fill="#2563EB" font-size="12">⏎</text>
  </g>

  <!-- ===== TESTING TEMPLATE (editable) ===== -->
  <text x="62" y="758" class="lbl">TESTING TEMPLATE</text>
  <rect x="62" y="768" width="736" height="92" rx="8" fill="#FBFCFD" stroke="#E2E6EA"/>
  <text x="78" y="790" class="lbl">SYSTEM</text>
  <rect class="inp" x="78" y="796" width="200" height="28" rx="6"/><text x="90" y="815" class="tdark" font-size="11">SAP S/4HANA ▾</text>
  <text x="294" y="790" class="lbl">LOCATION</text>
  <rect class="inp" x="294" y="796" width="200" height="28" rx="6"/><text x="306" y="815" class="tdark" font-size="11">GL clearing account</text>
  <text x="510" y="790" class="lbl">CHECK</text>
  <rect class="inp" x="510" y="796" width="120" height="28" rx="6"/><text x="522" y="815" class="tdark" font-size="11">presence ▾</text>
  <text x="646" y="790" class="lbl">EXPECTED</text>
  <rect class="inp" x="646" y="796" width="136" height="28" rx="6"/><text x="658" y="815" class="tdark" font-size="11">0 unmatched</text>
  <text x="78" y="848" class="tmut" font-size="10.5">Defines how this step is verified for the client's close process.</text>

  <!-- propagation toast -->
  <rect x="62" y="886" width="470" height="44" rx="8" fill="#1A2733"/>
  <text x="80" y="906" fill="#fff" font-size="12">✓ Senior Accountant added</text>
  <text x="80" y="922" fill="#9FE3C0" font-size="11">Now applied in Org chart, Applications &amp; 2 other value streams</text>
  <text x="500" y="912" fill="#7FB2FF" font-size="12" font-weight="700">Undo</text>

  <!-- no node-ops / auto note -->
  <rect x="62" y="946" width="736" height="40" rx="8" fill="#F4ECF7" stroke="#E6D6F0"/>
  <text x="78" y="964" fill="#6C3FA0" font-size="11.5" font-weight="600">No manual hierarchy steps.</text>
  <text x="78" y="980" fill="#7C4DB8" font-size="11">When you add or move an item, the app places it and wires the associations automatically.</text>

  <!-- ===== MARKERS ===== -->
  <g>
    <circle cx="52" cy="62" r="13" class="marker"/><text x="48" y="67" class="mtxt">1</text>
    <circle cx="784" cy="274" r="13" class="marker"/><text x="780" y="279" class="mtxt">2</text>
    <circle cx="784" cy="411" r="13" class="marker"/><text x="780" y="416" class="mtxt">3</text>
    <circle cx="784" cy="612" r="13" class="marker"/><text x="780" y="617" class="mtxt">4</text>
    <circle cx="52" cy="758" r="13" class="marker"/><text x="48" y="763" class="mtxt">5</text>
    <circle cx="52" cy="908" r="13" class="marker"/><text x="48" y="913" class="mtxt">6</text>
    <circle cx="52" cy="966" r="13" class="marker"/><text x="48" y="971" class="mtxt">7</text>
    <circle cx="710" cy="107" r="13" class="marker"/><text x="706" y="112" class="mtxt">8</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <rect class="panel" x="840" y="40" width="520" height="1060" rx="10"/>
  <rect x="840" y="40" width="520" height="1060" rx="10" fill="none" stroke="#E2E6EA"/>
  <text x="860" y="72" class="legb" font-size="15">WF-2 (rev) · L5 detail — Edit mode</text>
  <line x1="860" y1="84" x2="1340" y2="84" stroke="#EAEEF1"/>
  <g>
    <circle cx="870" cy="108" r="11" class="marker"/><text x="866" y="112" class="mtxt">1</text>
    <text x="890" y="106" class="legb">Single source of truth</text>
    <text x="890" y="124" class="tmut" font-size="11.5">The defining principle. Saving writes once; every other tab, the Org</text>
    <text x="890" y="139" class="tmut" font-size="11.5">chart, Applications, Deliverables and any stream using the item update.</text>

    <circle cx="870" cy="164" r="11" class="marker"/><text x="866" y="168" class="mtxt">2</text>
    <text x="890" y="162" class="legb">Associate OR add new role</text>
    <text x="890" y="180" class="tmut" font-size="11.5">Picker searches existing roles to associate, or creates a brand-new role</text>
    <text x="890" y="195" class="tmut" font-size="11.5">inline. Owner/Participant + RACI set on the row. ✕ detaches (keeps role).</text>

    <circle cx="870" cy="220" r="11" class="marker"/><text x="866" y="224" class="mtxt">3</text>
    <text x="890" y="218" class="legb">Associate OR add new application</text>
    <text x="890" y="236" class="tmut" font-size="11.5">Same pattern for apps; usage (performed / memorialized) on the row.</text>
    <text x="890" y="251" class="tmut" font-size="11.5">A new app added here appears in the Applications catalog instantly.</text>

    <circle cx="870" cy="276" r="11" class="marker"/><text x="866" y="280" class="mtxt">4</text>
    <text x="890" y="274" class="legb">Add / edit checklist items</text>
    <text x="890" y="292" class="tmut" font-size="11.5">Inline add (type → Enter), edit text, ✕ remove. Reads as the client's</text>
    <text x="890" y="307" class="tmut" font-size="11.5">close steps — no system/table names shown.</text>

    <circle cx="870" cy="332" r="11" class="marker"/><text x="866" y="336" class="mtxt">5</text>
    <text x="890" y="330" class="legb">Edit the testing template</text>
    <text x="890" y="348" class="tmut" font-size="11.5">System / Location / Check / Expected are editable fields describing how</text>
    <text x="890" y="363" class="tmut" font-size="11.5">the step is verified. No schema labels — just the client's control.</text>

    <circle cx="870" cy="388" r="11" class="marker"/><text x="866" y="392" class="mtxt">6</text>
    <text x="890" y="386" class="legb">Propagation confirmation + Undo</text>
    <text x="890" y="404" class="tmut" font-size="11.5">Toast names exactly where the change landed, so the user trusts that it</text>
    <text x="890" y="419" class="tmut" font-size="11.5">applied everywhere. Optimistic; Undo reverts the change app-wide.</text>

    <circle cx="870" cy="444" r="11" class="marker"/><text x="866" y="448" class="mtxt">7</text>
    <text x="890" y="442" class="legb">No "Node Operations" block</text>
    <text x="890" y="460" class="tmut" font-size="11.5">Removed. Users don't reparent / duplicate / delete nodes by hand — the</text>
    <text x="890" y="475" class="tmut" font-size="11.5">app infers placement &amp; wiring when items are added or moved.</text>

    <circle cx="868" cy="500" r="11" class="marker"/><text x="864" y="504" class="mtxt">8</text>
    <text x="890" y="498" class="legb">Level badge</text>
    <text x="890" y="516" class="tmut" font-size="11.5">Same layout at every level; the badge + content density change.</text>
    <text x="890" y="531" class="tmut" font-size="11.5">L5 = full detail (this screen). L3 / L4 = rollups (see WF-6).</text>
  </g>
  <line x1="860" y1="556" x2="1340" y2="556" stroke="#EAEEF1"/>
  <text x="860" y="582" class="legb" font-size="13">What "showcase the client, not our build" means</text>
  <g class="tmut" font-size="11.5">
    <text x="860" y="604">• No table / entity / column names anywhere in the UI.</text>
    <text x="860" y="623">• Labels are the client's business terms (admin-editable).</text>
    <text x="860" y="642">• Items read as their organization (roles, apps, controls) —</text>
    <text x="876" y="657">an organized picture of how the company runs, cleanly.</text>
  </g>
  <line x1="860" y1="676" x2="1340" y2="676" stroke="#EAEEF1"/>
  <text x="860" y="702" class="legb" font-size="13">CRUD on this screen (all auto-propagate)</text>
  <g class="tmut" font-size="11.5">
    <text x="860" y="724">Roles — associate existing or add new · set Owner/Participant + RACI · detach</text>
    <text x="860" y="744">Applications — associate existing or add new · set usage · detach</text>
    <text x="860" y="764">Deliverables — associate / open</text>
    <text x="860" y="784">Checklist items — add · edit text · remove</text>
    <text x="860" y="804">Testing template — edit System/Location/Check/Expected</text>
    <text x="860" y="824">Tasks (steps) — add; app auto-places under the right parent</text>
  </g>
  <rect x="860" y="846" width="480" height="232" rx="8" fill="#E7F6EF" stroke="#CBEAD9"/>
  <text x="876" y="872" class="legb" font-size="13">Single-source-of-truth — required behavior</text>
  <g fill="#1E7A52" font-size="11.5">
    <text x="876" y="894">Any association that is added, edited, created, or moved here must:</text>
    <text x="876" y="916">1 · write to one canonical record (no per-screen copies);</text>
    <text x="876" y="936">2 · immediately reflect in every other tab of this inspector;</text>
    <text x="876" y="956">3 · reflect everywhere the entity appears app-wide (Org chart,</text>
    <text x="892" y="972">Applications, Deliverables, other value streams, Map &amp; List);</text>
    <text x="876" y="992">4 · keep rollups at L3 / L4 in sync automatically;</text>
    <text x="876" y="1012">5 · be reversible (Undo) and recorded in history.</text>
    <text x="876" y="1040" font-weight="700" fill="#15603F">A new app/role/checklist item created here is the same record</text>
    <text x="876" y="1058" font-weight="700" fill="#15603F">the rest of the app reads — never a duplicate.</text>
  </g>
</svg>
