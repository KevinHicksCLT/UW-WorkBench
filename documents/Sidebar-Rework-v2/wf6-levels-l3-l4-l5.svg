<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <style>
      .pg{fill:#F1F3F5}
      .panel{fill:#FFFFFF}
      .tdark{fill:#1A2733}
      .tmut{fill:#6B7785}
      .lbl{font-size:10.5px;fill:#6B7785;letter-spacing:.4px}
      .hd{font-size:13px;fill:#1A2733;font-weight:700}
      .legb{font-size:13px;fill:#1A2733;font-weight:700}
    </style>
  </defs>
  <rect class="pg" x="0" y="0" width="1600" height="1020"/>
  <text x="40" y="40" class="tdark" font-size="17" font-weight="700">WF-6 · Same sidebar, data by level — L3 rollup → L4 → L5 detail</text>
  <text x="40" y="62" class="tmut" font-size="12.5">Identical panel &amp; tabs at every level and in both List + Map. Only the depth of content changes. No system/table names — the client's own structure, organized.</text>

  <!-- ============ L3 ============ -->
  <rect class="panel" x="40" y="84" width="360" height="840" rx="8"/>
  <rect x="40" y="84" width="360" height="840" rx="8" fill="none" stroke="#E2E6EA"/>
  <rect x="40" y="84" width="360" height="6" rx="3" fill="#E67E22"/>
  <text x="58" y="112" class="tmut" font-size="9.5">Corporate Functions ▸ Finance</text>
  <text x="58" y="132" class="tdark" font-size="14" font-weight="700">Accounting &amp; Financial Close</text>
  <rect x="58" y="142" width="120" height="20" rx="10" fill="#EAF1FE"/><text x="68" y="156" fill="#1D4ED8" font-size="10" font-weight="700">L3 · ROLLUP (all)</text>
  <!-- tabs -->
  <line x1="40" y1="176" x2="400" y2="176" stroke="#E2E6EA"/>
  <g font-size="10"><text x="58" y="171" fill="#2563EB" font-weight="700">Overview</text><text x="118" y="171" class="tmut">Roles</text><text x="158" y="171" class="tmut">Apps</text><text x="194" y="171" class="tmut">Deliv.</text><text x="234" y="171" class="tmut">Tasks</text><text x="276" y="171" class="tmut">Checklist</text><text x="338" y="171" class="tmut">Test</text></g>
  <text x="58" y="200" class="lbl">EVERYTHING BELOW THIS STREAM</text>
  <!-- 6 rollup tiles -->
  <g>
    <rect x="58" y="210" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="70" y="234" class="tdark" font-size="16" font-weight="700">9</text><text x="70" y="249" class="tmut" font-size="9.5">Roles</text>
    <rect x="171" y="210" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="183" y="234" class="tdark" font-size="16" font-weight="700">7</text><text x="183" y="249" class="tmut" font-size="9.5">Applications</text>
    <rect x="284" y="210" width="100" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="296" y="234" class="tdark" font-size="16" font-weight="700">24</text><text x="296" y="249" class="tmut" font-size="9.5">Deliverables</text>
    <rect x="58" y="262" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="70" y="286" class="tdark" font-size="16" font-weight="700">312</text><text x="70" y="301" class="tmut" font-size="9.5">Tasks</text>
    <rect x="171" y="262" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="183" y="286" class="tdark" font-size="16" font-weight="700">86</text><text x="183" y="301" class="tmut" font-size="9.5">Checklist items</text>
    <rect x="284" y="262" width="100" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="296" y="286" class="tdark" font-size="16" font-weight="700">18</text><text x="296" y="301" class="tmut" font-size="9.5">Testing tmpl.</text>
  </g>
  <text x="58" y="334" class="lbl">TOP ROLES (rolled up)</text>
  <rect x="58" y="342" width="326" height="26" rx="6" fill="#F7FBF8" stroke="#CBEAD9"/><text x="72" y="359" fill="#15603F" font-size="11">Senior Accountant · 42 tasks ↗</text>
  <rect x="58" y="372" width="326" height="26" rx="6" fill="#F7FBF8" stroke="#CBEAD9"/><text x="72" y="389" fill="#15603F" font-size="11">Accounting Manager · 28 tasks ↗</text>
  <text x="58" y="420" class="lbl">TOP APPLICATIONS (rolled up)</text>
  <rect x="58" y="428" width="326" height="26" rx="6" fill="#EFF5FF" stroke="#D4E2FC"/><text x="72" y="445" fill="#1D4ED8" font-size="11">SAP S/4HANA · 180 tasks ↗</text>
  <rect x="58" y="458" width="326" height="26" rx="6" fill="#EFF5FF" stroke="#D4E2FC"/><text x="72" y="475" fill="#1D4ED8" font-size="11">BlackLine · 64 tasks ↗</text>
  <text x="58" y="506" class="lbl">SUB-PROCESSES (drill to L4)</text>
  <rect x="58" y="514" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="72" y="530" class="tdark" font-size="10.5">1 · Subledger Close &amp; Journal Entry ↗</text>
  <rect x="58" y="542" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="72" y="558" class="tdark" font-size="10.5">2 · Fixed Asset Accounting ↗</text>
  <rect x="58" y="570" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="72" y="586" class="tdark" font-size="10.5">3 · Account Reconciliation ↗</text>
  <rect x="58" y="598" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="72" y="614" class="tdark" font-size="10.5">+ 3 more ↗</text>
  <rect x="58" y="640" width="326" height="40" rx="8" fill="#FBFCFD" stroke="#EAEEF1"/>
  <text x="72" y="658" class="tmut" font-size="10.5">Read-only summary. Use it to see scale &amp;</text>
  <text x="72" y="673" class="tmut" font-size="10.5">coverage. Drill in to edit the detail.</text>
  <text x="58" y="710" class="hd" font-size="12">Purpose</text>
  <text x="58" y="730" class="tmut" font-size="11">A bird's-eye total of how the whole value</text>
  <text x="58" y="746" class="tmut" font-size="11">stream operates — every role, app, control.</text>

  <!-- ============ L4 ============ -->
  <rect class="panel" x="420" y="84" width="360" height="840" rx="8"/>
  <rect x="420" y="84" width="360" height="840" rx="8" fill="none" stroke="#E2E6EA"/>
  <rect x="420" y="84" width="360" height="6" rx="3" fill="#E0A977"/>
  <text x="438" y="112" class="tmut" font-size="9.5">… ▸ Accounting &amp; Close</text>
  <text x="438" y="132" class="tdark" font-size="14" font-weight="700">Subledger Close &amp; Journal Entry</text>
  <rect x="438" y="142" width="130" height="20" rx="10" fill="#FCEFE0"/><text x="448" y="156" fill="#7E4A12" font-size="10" font-weight="700">L4 · ROLLUP (less)</text>
  <line x1="420" y1="176" x2="780" y2="176" stroke="#E2E6EA"/>
  <g font-size="10"><text x="438" y="171" fill="#2563EB" font-weight="700">Overview</text><text x="498" y="171" class="tmut">Roles</text><text x="538" y="171" class="tmut">Apps</text><text x="574" y="171" class="tmut">Deliv.</text><text x="614" y="171" class="tmut">Tasks</text><text x="656" y="171" class="tmut">Checklist</text><text x="718" y="171" class="tmut">Test</text></g>
  <text x="438" y="200" class="lbl">EVERYTHING IN THIS SUB-PROCESS</text>
  <g>
    <rect x="438" y="210" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="450" y="234" class="tdark" font-size="16" font-weight="700">4</text><text x="450" y="249" class="tmut" font-size="9.5">Roles</text>
    <rect x="551" y="210" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="563" y="234" class="tdark" font-size="16" font-weight="700">3</text><text x="563" y="249" class="tmut" font-size="9.5">Applications</text>
    <rect x="664" y="210" width="100" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="676" y="234" class="tdark" font-size="16" font-weight="700">6</text><text x="676" y="249" class="tmut" font-size="9.5">Deliverables</text>
    <rect x="438" y="262" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="450" y="286" class="tdark" font-size="16" font-weight="700">42</text><text x="450" y="301" class="tmut" font-size="9.5">Tasks</text>
    <rect x="551" y="262" width="105" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="563" y="286" class="tdark" font-size="16" font-weight="700">19</text><text x="563" y="301" class="tmut" font-size="9.5">Checklist items</text>
    <rect x="664" y="262" width="100" height="46" rx="7" fill="#F7F9FB" stroke="#EAEEF1"/><text x="676" y="286" class="tdark" font-size="16" font-weight="700">5</text><text x="676" y="301" class="tmut" font-size="9.5">Testing tmpl.</text>
  </g>
  <text x="438" y="334" class="lbl">ROLES</text>
  <rect x="438" y="342" width="326" height="26" rx="6" fill="#F7FBF8" stroke="#CBEAD9"/><text x="452" y="359" fill="#15603F" font-size="11">Senior Accountant · 12 tasks ↗</text>
  <rect x="438" y="372" width="326" height="26" rx="6" fill="#F7FBF8" stroke="#CBEAD9"/><text x="452" y="389" fill="#15603F" font-size="11">Staff Accountant · 18 tasks ↗</text>
  <text x="438" y="420" class="lbl">APPLICATIONS</text>
  <rect x="438" y="428" width="326" height="26" rx="6" fill="#EFF5FF" stroke="#D4E2FC"/><text x="452" y="445" fill="#1D4ED8" font-size="11">SAP S/4HANA (GL) ↗</text>
  <rect x="438" y="458" width="326" height="26" rx="6" fill="#EFF5FF" stroke="#D4E2FC"/><text x="452" y="475" fill="#1D4ED8" font-size="11">BlackLine (Close) ↗</text>
  <text x="438" y="506" class="lbl">STEPS (drill to L5)</text>
  <rect x="438" y="514" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="452" y="530" class="tdark" font-size="10.5">1 · Validate subledger-to-GL postings ↗</text>
  <rect x="438" y="542" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="452" y="558" class="tdark" font-size="10.5">2 · Prepare &amp; post recurring accruals ↗</text>
  <rect x="438" y="570" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="452" y="586" class="tdark" font-size="10.5">3 · Review &amp; approve manual entries ↗</text>
  <rect x="438" y="598" width="326" height="24" rx="6" fill="#fff" stroke="#E2E6EA"/><text x="452" y="614" class="tdark" font-size="10.5">4 · Run period-end close &amp; lock ↗</text>
  <rect x="438" y="640" width="326" height="40" rx="8" fill="#FBFCFD" stroke="#EAEEF1"/>
  <text x="452" y="658" class="tmut" font-size="10.5">Same shape as L3, scoped to this sub-</text>
  <text x="452" y="673" class="tmut" font-size="10.5">process — fewer items, still a summary.</text>
  <text x="438" y="710" class="hd" font-size="12">Purpose</text>
  <text x="438" y="730" class="tmut" font-size="11">A focused rollup for one sub-process —</text>
  <text x="438" y="746" class="tmut" font-size="11">the bridge between the stream and steps.</text>

  <!-- ============ L5 ============ -->
  <rect class="panel" x="800" y="84" width="360" height="840" rx="8"/>
  <rect x="800" y="84" width="360" height="840" rx="8" fill="none" stroke="#C9D1D8" stroke-width="1.5"/>
  <rect x="800" y="84" width="360" height="6" rx="3" fill="#2563EB"/>
  <text x="818" y="112" class="tmut" font-size="9.5">… ▸ Subledger Close</text>
  <text x="818" y="132" class="tdark" font-size="13.5" font-weight="700">Validate subledger-to-GL postings</text>
  <rect x="818" y="142" width="116" height="20" rx="10" fill="#EAF1FE"/><text x="828" y="156" fill="#1D4ED8" font-size="10" font-weight="700">L5 · FULL DETAIL</text>
  <line x1="800" y1="176" x2="1160" y2="176" stroke="#E2E6EA"/>
  <g font-size="10"><text x="818" y="171" class="tmut">Overview</text><text x="878" y="171" fill="#2563EB" font-weight="700">Roles</text><text x="918" y="171" class="tmut">Apps</text><text x="954" y="171" class="tmut">Deliv.</text><text x="994" y="171" class="tmut">Tasks</text><text x="1036" y="171" class="tmut">Checklist</text><text x="1098" y="171" class="tmut">Test</text></g>

  <text x="818" y="200" class="lbl">ROLES</text>
  <rect x="818" y="208" width="326" height="32" rx="7" fill="#F7FBF8" stroke="#CBEAD9"/><circle cx="834" cy="224" r="4" fill="#1E9E6A"/><text x="848" y="228" fill="#15603F" font-size="11" font-weight="600">Senior Accountant</text><rect x="1020" y="216" width="48" height="16" rx="8" fill="#fff" stroke="#CBEAD9"/><text x="1028" y="228" fill="#15603F" font-size="9">Owner</text><text x="1126" y="228" fill="#2563EB" font-size="11">↗</text>
  <rect x="818" y="244" width="326" height="32" rx="7" fill="#F7FBF8" stroke="#CBEAD9"/><circle cx="834" cy="260" r="4" fill="#7FC9A6"/><text x="848" y="264" fill="#15603F" font-size="11" font-weight="600">Staff Accountant</text><rect x="1004" y="252" width="64" height="16" rx="8" fill="#fff" stroke="#CBEAD9"/><text x="1012" y="264" fill="#15603F" font-size="9">Participant</text><text x="1126" y="264" fill="#2563EB" font-size="11">↗</text>

  <text x="818" y="298" class="lbl">APPLICATIONS</text>
  <rect x="818" y="306" width="326" height="30" rx="7" fill="#EFF5FF" stroke="#D4E2FC"/><text x="832" y="325" fill="#1D4ED8" font-size="11" font-weight="600">SAP S/4HANA (GL)</text><rect x="996" y="313" width="72" height="16" rx="8" fill="#fff" stroke="#D4E2FC"/><text x="1004" y="325" fill="#1D4ED8" font-size="9">performed</text><text x="1126" y="325" fill="#2563EB" font-size="11">↗</text>
  <rect x="818" y="340" width="326" height="30" rx="7" fill="#EFF5FF" stroke="#D4E2FC"/><text x="832" y="359" fill="#1D4ED8" font-size="11" font-weight="600">BlackLine (Close)</text><rect x="984" y="347" width="84" height="16" rx="8" fill="#fff" stroke="#D4E2FC"/><text x="992" y="359" fill="#1D4ED8" font-size="9">memorialized</text><text x="1126" y="359" fill="#2563EB" font-size="11">↗</text>

  <text x="818" y="392" class="lbl">DELIVERABLE</text>
  <rect x="818" y="400" width="326" height="30" rx="7" fill="#E9F7EF" stroke="#CBEAD9"/><text x="832" y="419" fill="#196F3D" font-size="11" font-weight="600">Subledger Close &amp; Journal Entry ↗</text>

  <text x="818" y="452" class="lbl">CHECKLIST ITEMS</text>
  <g font-size="10.5">
    <rect x="818" y="460" width="326" height="26" rx="6" fill="#fff" stroke="#EAEEF1"/><text x="832" y="477" fill="#1E9E6A" font-size="11">✓</text><text x="850" y="477" class="tdark">Subledgers fully posted to GL</text>
    <rect x="818" y="490" width="326" height="26" rx="6" fill="#fff" stroke="#EAEEF1"/><text x="832" y="507" fill="#1E9E6A" font-size="11">✓</text><text x="850" y="507" class="tdark">Control totals match clearing accounts</text>
    <rect x="818" y="520" width="326" height="26" rx="6" fill="#fff" stroke="#EAEEF1"/><text x="832" y="537" fill="#1E9E6A" font-size="11">✓</text><text x="850" y="537" class="tdark">Suspense &amp; unmatched items cleared</text>
    <rect x="818" y="550" width="326" height="26" rx="6" fill="#fff" stroke="#EAEEF1"/><text x="832" y="567" fill="#1E9E6A" font-size="11">✓</text><text x="850" y="567" class="tdark">Deferred postings documented</text>
  </g>

  <text x="818" y="600" class="lbl">TESTING TEMPLATE</text>
  <rect x="818" y="608" width="326" height="56" rx="7" fill="#FBFCFD" stroke="#E2E6EA"/>
  <text x="832" y="627" class="tdark" font-size="10.5"><tspan font-weight="700">System:</tspan> SAP S/4HANA · <tspan font-weight="700">Location:</tspan> GL clearing</text>
  <text x="832" y="645" class="tdark" font-size="10.5"><tspan font-weight="700">Check:</tspan> presence · <tspan font-weight="700">Expected:</tspan> 0 unmatched items</text>
  <text x="832" y="660" class="tmut" font-size="9.5">How this step is verified.</text>

  <rect x="818" y="678" width="326" height="34" rx="8" fill="#EAF1FE" stroke="#D4E2FC"/>
  <text x="832" y="699" fill="#1D4ED8" font-size="11" font-weight="600">✎ Edit — add/associate roles, apps, items…</text>
  <text x="818" y="740" class="hd" font-size="12">Purpose</text>
  <text x="818" y="760" class="tmut" font-size="11">The real, editable detail of one step.</text>
  <text x="818" y="776" class="tmut" font-size="11">Everything here is the live, shared record.</text>

  <!-- ===== LEGEND ===== -->
  <rect class="panel" x="1190" y="84" width="370" height="840" rx="10"/>
  <rect x="1190" y="84" width="370" height="840" rx="10" fill="none" stroke="#E2E6EA"/>
  <text x="1210" y="116" class="legb" font-size="14">How the levels relate</text>
  <line x1="1210" y1="128" x2="1540" y2="128" stroke="#EAEEF1"/>
  <g class="tmut" font-size="11.5">
    <text x="1210" y="152" class="legb" fill="#7E4A12">L3 · Value stream — rollup (all)</text>
    <text x="1210" y="170">Totals + top items for the WHOLE stream:</text>
    <text x="1210" y="185">all roles, apps, deliverables, tasks,</text>
    <text x="1210" y="200">checklist items &amp; testing templates below it.</text>
    <text x="1210" y="215">Read-only summary; drill in to edit.</text>

    <text x="1210" y="244" class="legb" fill="#9A6A2E">L4 · Sub-process — rollup (less)</text>
    <text x="1210" y="262">Same six groups, scoped to one sub-process.</text>
    <text x="1210" y="277">Fewer items than L3. Lists the actual roles</text>
    <text x="1210" y="292">&amp; apps; steps drill to L5.</text>

    <text x="1210" y="321" class="legb" fill="#1D4ED8">L5 · Step / task — full detail</text>
    <text x="1210" y="339">The real, editable content of one step:</text>
    <text x="1210" y="354">named roles + RACI, apps + usage, the</text>
    <text x="1210" y="369">deliverable, every checklist item, and the</text>
    <text x="1210" y="384">testing template. This is where you edit</text>
    <text x="1210" y="399">(see WF-2).</text>
  </g>
  <line x1="1210" y1="418" x2="1540" y2="418" stroke="#EAEEF1"/>
  <text x="1210" y="444" class="legb" font-size="13">Constant across levels &amp; views</text>
  <g class="tmut" font-size="11.5">
    <text x="1210" y="466">• Same header, same tab set, same colors.</text>
    <text x="1210" y="486">• Identical in List and Map.</text>
    <text x="1210" y="506">• Only content density changes by level.</text>
    <text x="1210" y="526">• Rollups (L3/L4) are computed live from</text>
    <text x="1226" y="541">the L5 detail — so they're always correct.</text>
    <text x="1210" y="561">• Edit a detail at L5 and the L3/L4 counts</text>
    <text x="1226" y="576">update automatically.</text>
  </g>
  <line x1="1210" y1="596" x2="1540" y2="596" stroke="#EAEEF1"/>
  <text x="1210" y="622" class="legb" font-size="13">Client-first language</text>
  <g class="tmut" font-size="11.5">
    <text x="1210" y="644">Every label is the client's business term.</text>
    <text x="1210" y="664">No table names, no IDs, no schema. The</text>
    <text x="1210" y="684">panel reads as an organized view of how</text>
    <text x="1210" y="704">the company actually runs.</text>
  </g>
  <rect x="1210" y="724" width="330" height="180" rx="8" fill="#E7F6EF" stroke="#CBEAD9"/>
  <text x="1226" y="748" class="legb" font-size="12">One record, everywhere</text>
  <g fill="#1E7A52" font-size="11">
    <text x="1226" y="770">The rollups, the detail, the List, the Map,</text>
    <text x="1226" y="788">the Org chart and the Applications catalog</text>
    <text x="1226" y="806">all read the SAME underlying record.</text>
    <text x="1226" y="828">Add a checklist item or associate an app</text>
    <text x="1226" y="846">at L5 → L4 &amp; L3 counts rise, and the item</text>
    <text x="1226" y="864">shows anywhere that entity appears —</text>
    <text x="1226" y="882">instantly, with no duplicate data.</text>
  </g>
</svg>
