<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" font-family="'Segoe UI',Inter,Arial,sans-serif">
  <defs>
    <style>
      .pg{fill:#F1F3F5}
      .panel{fill:#FFFFFF}
      .tdark{fill:#1A2733}
      .tmut{fill:#6B7785}
      .lbl{font-size:11px;fill:#6B7785;letter-spacing:.4px}
      .marker{fill:#E8590C}
      .mtxt{fill:#fff;font-size:13px;font-weight:700}
      .legb{font-size:13px;fill:#1A2733;font-weight:700}
      .edge{stroke:#C2CBD4;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect class="pg" x="0" y="0" width="1600" height="1040"/>

  <!-- toolbar -->
  <rect x="24" y="20" width="116" height="34" rx="8" fill="#1A2733"/>
  <text x="44" y="42" fill="#9AA6B2" font-size="13">List</text>
  <text x="92" y="42" fill="#fff" font-size="13" font-weight="600">▦ Map</text>

  <!-- EDIT toolbar (simplified — no manual node surgery) -->
  <rect x="156" y="20" width="560" height="34" rx="8" fill="#E7F6EF" stroke="#BFE3D0"/>
  <text x="172" y="42" fill="#15603F" font-size="12" font-weight="700">EDIT</text>
  <text x="214" y="42" fill="#1E7A52" font-size="11.5">＋ Add step</text>
  <text x="300" y="42" fill="#1E7A52" font-size="11.5">✎ Rename</text>
  <text x="376" y="42" fill="#1E7A52" font-size="11.5">⇅ Reorder</text>
  <text x="462" y="42" fill="#1E7A52" font-size="11.5">⤺ Undo</text>
  <text x="524" y="42" fill="#1E7A52" font-size="11.5">⤢ Auto-layout</text>
  <rect x="636" y="26" width="64" height="22" rx="6" fill="#1E9E6A"/><text x="650" y="42" fill="#fff" font-size="12" font-weight="700">✓ Done</text>
  <text x="156" y="74" fill="#1E7A52" font-size="11">Manage roles, apps, checklist &amp; testing in the panel → the app auto-places &amp; wires everything · click a node to inspect</text>

  <!-- ===== CANVAS ===== -->
  <rect class="panel" x="24" y="88" width="900" height="924" rx="8"/>
  <rect x="24" y="88" width="900" height="924" rx="8" fill="none" stroke="#E2E6EA"/>
  <g fill="#EDF0F3">
    <circle cx="120" cy="160" r="1.5"/><circle cx="220" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="420" cy="160" r="1.5"/><circle cx="520" cy="160" r="1.5"/><circle cx="620" cy="160" r="1.5"/><circle cx="720" cy="160" r="1.5"/><circle cx="820" cy="160" r="1.5"/>
  </g>

  <!-- edges -->
  <path class="edge" d="M474,168 V200 M300,236 H650 M300,236 V268 M474,236 V268 M650,236 V268"/>
  <path class="edge" d="M300,316 V360 M170,396 H470 M170,396 V430 M300,396 V430 M470,396 V430"/>

  <!-- root -->
  <rect x="404" y="128" width="140" height="40" rx="8" fill="#1A2733"/>
  <text x="474" y="153" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ABC Insurance</text>

  <!-- domains -->
  <rect x="232" y="204" width="136" height="40" rx="8" fill="#E9F7EF" stroke="#27AE60"/>
  <text x="300" y="229" fill="#196F3D" font-size="12" font-weight="600" text-anchor="middle">Technology</text>
  <rect x="406" y="204" width="136" height="40" rx="8" fill="#FCEFE0" stroke="#E67E22" stroke-width="2"/>
  <text x="474" y="229" fill="#7E4A12" font-size="12" font-weight="700" text-anchor="middle">Corporate Fns</text>
  <rect x="582" y="204" width="136" height="40" rx="8" fill="#EAF2F8" stroke="#2980B9"/>
  <text x="650" y="229" fill="#1A5276" font-size="12" font-weight="600" text-anchor="middle">Core Business</text>

  <!-- divisions -->
  <rect x="232" y="276" width="136" height="40" rx="8" fill="#FCEFE0" stroke="#E0A977"/>
  <text x="300" y="301" fill="#7E4A12" font-size="11.5" font-weight="600" text-anchor="middle">Finance &amp; Inv.</text>
  <rect x="406" y="276" width="136" height="40" rx="8" fill="#fff" stroke="#E2D2C0"/>
  <text x="474" y="301" fill="#A98763" font-size="11.5" text-anchor="middle">Risk &amp; Audit</text>
  <rect x="582" y="276" width="136" height="40" rx="8" fill="#fff" stroke="#E2D2C0"/>
  <text x="650" y="301" fill="#A98763" font-size="11.5" text-anchor="middle">HR &amp; Talent</text>

  <!-- value streams (L3) -->
  <rect x="104" y="372" width="136" height="44" rx="8" fill="#fff" stroke="#E2D2C0"/>
  <text x="172" y="398" fill="#7E4A12" font-size="11" text-anchor="middle">Financial Planning</text>
  <!-- SELECTED L3 node -->
  <rect x="248" y="368" width="160" height="52" rx="8" fill="#FCF6EE" stroke="#E67E22" stroke-width="2.5"/>
  <text x="328" y="390" fill="#7E4A12" font-size="11.5" font-weight="700" text-anchor="middle">Accounting &amp;</text>
  <text x="328" y="406" fill="#7E4A12" font-size="11.5" font-weight="700" text-anchor="middle">Financial Close</text>
  <rect x="243" y="363" width="170" height="62" rx="11" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- L3 badge on node -->
  <rect x="250" y="372" width="26" height="16" rx="8" fill="#EAF1FE"/><text x="256" y="384" fill="#1D4ED8" font-size="9" font-weight="700">L3</text>
  <!-- hover add + menu -->
  <circle cx="328" cy="432" r="11" fill="#1E9E6A"/><text x="328" y="437" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">+</text>
  <circle cx="413" cy="394" r="10" fill="#fff" stroke="#2563EB"/><text x="413" y="399" fill="#2563EB" font-size="12" text-anchor="middle">⋯</text>

  <rect x="416" y="372" width="136" height="44" rx="8" fill="#fff" stroke="#E2D2C0"/>
  <text x="484" y="398" fill="#7E4A12" font-size="11" text-anchor="middle">Statutory Report</text>

  <!-- light node menu (no reparent/delete-surgery) -->
  <rect x="430" y="402" width="184" height="98" rx="8" fill="#fff" stroke="#D6DBE0"/>
  <g font-size="12" fill="#33414E">
    <text x="446" y="426">✎ Open inspector</text>
    <text x="446" y="450">＋ Add step inside</text>
    <text x="446" y="474">⇅ Reorder</text>
  </g>
  <text x="446" y="494" fill="#9AA6B2" font-size="10">No reparent / delete by hand</text>

  <!-- new-node ghost -->
  <rect x="250" y="470" width="156" height="40" rx="8" fill="#EAF1FE" stroke="#2563EB" stroke-dasharray="5 3"/>
  <text x="328" y="495" fill="#2563EB" font-size="11.5" text-anchor="middle" font-style="italic">New step — type name…</text>

  <!-- zoom -->
  <rect x="48" y="940" width="34" height="34" rx="8" fill="#fff" stroke="#E2E6EA"/><text x="60" y="962" class="tdark" font-size="16">＋</text>

  <!-- ===== SHARED INSPECTOR (L3 rollup, view) ===== -->
  <rect class="panel" x="936" y="88" width="332" height="924" rx="8"/>
  <rect x="936" y="88" width="332" height="924" rx="8" fill="none" stroke="#C9D1D8"/>
  <rect x="936" y="88" width="332" height="6" rx="3" fill="#E67E22"/>
  <text x="952" y="120" class="tmut" font-size="10">Corp Fns ▸ Finance ▸ …</text>
  <text x="952" y="142" class="tdark" font-size="14" font-weight="700">Accounting &amp; Financial</text>
  <text x="952" y="160" class="tdark" font-size="14" font-weight="700">Close</text>
  <rect x="952" y="170" width="116" height="20" rx="10" fill="#EAF1FE"/><text x="962" y="184" fill="#1D4ED8" font-size="10" font-weight="700">L3 · ROLLUP VIEW</text>
  <rect x="1076" y="170" width="80" height="20" rx="10" fill="#FDF3E2"/><text x="1086" y="184" fill="#C77700" font-size="10">⚙ Augmented</text>
  <!-- actions -->
  <rect x="952" y="200" width="62" height="28" rx="6" fill="#2563EB"/><text x="965" y="219" fill="#fff" font-size="11" font-weight="600">✎ Edit</text>
  <rect x="1022" y="200" width="80" height="28" rx="6" fill="#fff" stroke="#D6DBE0"/><text x="1034" y="219" class="tdark" font-size="11">⤢ Expand</text>
  <!-- sync pill -->
  <rect x="1112" y="200" width="148" height="28" rx="14" fill="#E7F6EF" stroke="#CBEAD9"/><text x="1126" y="219" fill="#15603F" font-size="10.5" font-weight="600">⟲ One source of truth</text>
  <!-- tabs condensed -->
  <line x1="936" y1="246" x2="1268" y2="246" stroke="#E2E6EA"/>
  <g font-size="11">
    <text x="952" y="241" fill="#2563EB" font-weight="700">Overview</text><rect x="948" y="244" width="52" height="3" fill="#2563EB"/>
    <text x="1020" y="241" class="tmut">Roles</text>
    <text x="1066" y="241" class="tmut">Apps</text>
    <text x="1110" y="241" class="tmut">Deliv.</text>
    <text x="1156" y="241" class="tmut">Checklist</text>
    <text x="1224" y="241" class="tmut">⋯</text>
  </g>
  <!-- rollup tiles -->
  <text x="952" y="268" class="lbl">ROLLED UP ACROSS THIS STREAM</text>
  <rect x="952" y="276" width="100" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="964" y="302" class="tdark" font-size="17" font-weight="700">312</text><text x="964" y="317" class="tmut" font-size="10">Steps</text>
  <rect x="1060" y="276" width="100" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="1072" y="302" class="tdark" font-size="17" font-weight="700">9</text><text x="1072" y="317" class="tmut" font-size="10">Roles</text>
  <rect x="1168" y="276" width="92" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="1180" y="302" class="tdark" font-size="17" font-weight="700">7</text><text x="1180" y="317" class="tmut" font-size="10">Apps</text>
  <rect x="952" y="330" width="100" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="964" y="356" class="tdark" font-size="17" font-weight="700">24</text><text x="964" y="371" class="tmut" font-size="10">Deliverables</text>
  <rect x="1060" y="330" width="100" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="1072" y="356" class="tdark" font-size="17" font-weight="700">86</text><text x="1072" y="371" class="tmut" font-size="10">Checklist items</text>
  <rect x="1168" y="330" width="92" height="48" rx="8" fill="#F7F9FB" stroke="#EAEEF1"/><text x="1180" y="356" class="tdark" font-size="17" font-weight="700">18</text><text x="1180" y="371" class="tmut" font-size="10">Tests</text>

  <text x="952" y="408" class="lbl">TOP ROLES (rolled up)</text>
  <rect x="952" y="418" width="308" height="28" rx="7" fill="#F7FBF8" stroke="#CBEAD9"/><text x="966" y="436" fill="#15603F" font-size="11">Senior Accountant · 42 steps ↗</text>
  <rect x="952" y="450" width="308" height="28" rx="7" fill="#F7FBF8" stroke="#CBEAD9"/><text x="966" y="468" fill="#15603F" font-size="11">Accounting Manager · 28 steps ↗</text>

  <text x="952" y="500" class="lbl">CHILD SUB-PROCESSES (drill to L4)</text>
  <rect x="952" y="510" width="308" height="28" rx="7" fill="#fff" stroke="#E2E6EA"/><text x="966" y="528" class="tdark" font-size="11">1 · Subledger Close &amp; Journal Entry ↗</text>
  <rect x="952" y="542" width="308" height="28" rx="7" fill="#fff" stroke="#E2E6EA"/><text x="966" y="560" class="tdark" font-size="11">2 · Fixed Asset Accounting ↗</text>
  <rect x="952" y="574" width="308" height="28" rx="7" fill="#fff" stroke="#E2E6EA"/><text x="966" y="592" class="tdark" font-size="11">3 · Account Reconciliation ↗</text>

  <rect x="952" y="624" width="308" height="40" rx="8" fill="#F4ECF7" stroke="#E6D6F0"/>
  <text x="966" y="641" fill="#6C3FA0" font-size="10.5" font-weight="600">L3 rolls up everything below · L4 shows less · L5 shows full detail</text>
  <text x="966" y="656" fill="#7C4DB8" font-size="10">Drill down for detail, or edit here — changes apply everywhere.</text>

  <line x1="936" y1="690" x2="1268" y2="690" stroke="#E2E6EA"/>
  <text x="952" y="714" fill="#2563EB" font-size="11" font-weight="600">⤢ Open expanded view</text>

  <!-- ===== MARKERS ===== -->
  <g>
    <circle cx="170" cy="37" r="13" class="marker"/><text x="166" y="42" class="mtxt">1</text>
    <circle cx="328" cy="346" r="13" class="marker"/><text x="324" y="351" class="mtxt">2</text>
    <circle cx="356" cy="432" r="13" class="marker"/><text x="352" y="437" class="mtxt">3</text>
    <circle cx="600" cy="494" r="13" class="marker"/><text x="596" y="499" class="mtxt">4</text>
    <circle cx="924" cy="180" r="13" class="marker"/><text x="920" y="185" class="mtxt">5</text>
    <circle cx="1112" cy="214" r="13" class="marker"/><text x="1108" y="219" class="mtxt">6</text>
    <circle cx="924" cy="300" r="13" class="marker"/><text x="920" y="305" class="mtxt">7</text>
    <circle cx="924" cy="644" r="13" class="marker"/><text x="920" y="649" class="mtxt">8</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <rect class="panel" x="1290" y="88" width="290" height="924" rx="10"/>
  <rect x="1290" y="88" width="290" height="924" rx="10" fill="none" stroke="#E2E6EA"/>
  <text x="1308" y="118" class="legb" font-size="14">WF-4 (rev) · Map + shared panel</text>
  <line x1="1308" y1="130" x2="1562" y2="130" stroke="#EAEEF1"/>
  <g>
    <circle cx="1318" cy="152" r="11" class="marker"/><text x="1314" y="156" class="mtxt">1</text>
    <text x="1338" y="150" class="legb">Lean edit toolbar</text>
    <text x="1338" y="168" class="tmut" font-size="11">Add step · rename · reorder · undo ·</text>
    <text x="1338" y="183" class="tmut" font-size="11">auto-layout. No manual reparent/delete</text>
    <text x="1338" y="198" class="tmut" font-size="11">surgery — the app wires associations.</text>

    <circle cx="1318" cy="220" r="11" class="marker"/><text x="1314" y="224" class="mtxt">2</text>
    <text x="1338" y="218" class="legb">Select → inspect</text>
    <text x="1338" y="236" class="tmut" font-size="11">Same panel as List. Single-click selects;</text>
    <text x="1338" y="251" class="tmut" font-size="11">double-click drills.</text>

    <circle cx="1318" cy="273" r="11" class="marker"/><text x="1314" y="277" class="mtxt">3</text>
    <text x="1338" y="271" class="legb">On-node add</text>
    <text x="1338" y="289" class="tmut" font-size="11">＋ adds a step inside; ⋯ opens a light</text>
    <text x="1338" y="304" class="tmut" font-size="11">menu (inspect / add / reorder only).</text>

    <circle cx="1318" cy="326" r="11" class="marker"/><text x="1314" y="330" class="mtxt">4</text>
    <text x="1338" y="324" class="legb">Inline create</text>
    <text x="1338" y="342" class="tmut" font-size="11">Type to name; the app places it under</text>
    <text x="1338" y="357" class="tmut" font-size="11">the right parent automatically.</text>

    <circle cx="1318" cy="379" r="11" class="marker"/><text x="1314" y="383" class="mtxt">5</text>
    <text x="1338" y="377" class="legb">Level = data, not layout</text>
    <text x="1338" y="395" class="tmut" font-size="11">Identical panel; badge shows the level.</text>
    <text x="1338" y="410" class="tmut" font-size="11">L3 here = rollup of all six content types.</text>

    <circle cx="1318" cy="432" r="11" class="marker"/><text x="1314" y="436" class="mtxt">6</text>
    <text x="1338" y="430" class="legb">Source-of-truth pill</text>
    <text x="1338" y="448" class="tmut" font-size="11">Always visible reminder: editing here</text>
    <text x="1338" y="463" class="tmut" font-size="11">updates List, Map &amp; the whole app.</text>

    <circle cx="1318" cy="485" r="11" class="marker"/><text x="1314" y="489" class="mtxt">7</text>
    <text x="1338" y="483" class="legb">Rollup tiles &amp; lists</text>
    <text x="1338" y="501" class="tmut" font-size="11">Counts &amp; top items aggregated across the</text>
    <text x="1338" y="516" class="tmut" font-size="11">whole stream; each links to detail.</text>

    <circle cx="1318" cy="538" r="11" class="marker"/><text x="1314" y="542" class="mtxt">8</text>
    <text x="1338" y="536" class="legb">Level guide</text>
    <text x="1338" y="554" class="tmut" font-size="11">In-context note of what L3/L4/L5 show.</text>
  </g>
  <line x1="1308" y1="578" x2="1562" y2="578" stroke="#EAEEF1"/>
  <text x="1308" y="602" class="legb" font-size="13">Same data, both views</text>
  <g class="tmut" font-size="11.5">
    <text x="1308" y="624">Map and List share one selection model,</text>
    <text x="1308" y="643">one inspector, one edit experience, and</text>
    <text x="1308" y="662">one underlying record. Edit a role's name,</text>
    <text x="1308" y="681">add an app, or add a checklist item in</text>
    <text x="1308" y="700">either view and it appears in the other —</text>
    <text x="1308" y="719">and everywhere else it's used — at once.</text>
  </g>
  <rect x="1308" y="742" width="254" height="250" rx="8" fill="#E7F6EF" stroke="#CBEAD9"/>
  <text x="1322" y="766" class="legb" font-size="12">Data by level</text>
  <g fill="#1E7A52" font-size="11">
    <text x="1322" y="788" font-weight="700" fill="#15603F">L3 — Value stream</text>
    <text x="1322" y="806">Rollup of ALL roles, apps, deliverables,</text>
    <text x="1322" y="822">tasks, checklist items &amp; tests below it.</text>
    <text x="1322" y="846" font-weight="700" fill="#15603F">L4 — Sub-process</text>
    <text x="1322" y="864">Same shape, scoped smaller (less than L3).</text>
    <text x="1322" y="888" font-weight="700" fill="#15603F">L5 — Step / Task</text>
    <text x="1322" y="906">Full detail: the actual roles, apps,</text>
    <text x="1322" y="922">deliverable, checklist items &amp; testing</text>
    <text x="1322" y="938">template — editable (see WF-2).</text>
    <text x="1322" y="962" fill="#6C3FA0">Layout never changes between levels —</text>
    <text x="1322" y="978" fill="#6C3FA0">only how much detail is shown.</text>
  </g>
</svg>
