name: Neon preview branches

# Per-PR Neon database branches, forked from `develop`.
# Open/reopen/push a PR  -> creates a Neon branch off `develop`
# Close/merge the PR      -> deletes that Neon branch
#
# Requires two repo secrets:
#   NEON_PROJECT_ID  (set: billowing-salad-46113160 / CapgeminiTransformationBridge)
#   NEON_API_KEY     (Neon console -> Account settings -> API Keys)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: neon-preview-${{ github.event.number }}
  cancel-in-progress: false

# Branch off develop; one Neon branch per PR.
env:
  NEON_BRANCH_NAME: preview/pr-${{ github.event.number }}
  PARENT_BRANCH: develop

jobs:
  create-branch:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create Neon branch from develop
        id: create
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: ${{ env.PARENT_BRANCH }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          role: neondb_owner
          database: neondb
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Comment connection string on PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### 🌿 Neon preview branch ready',
              '',
              '- **Branch:** `${{ env.NEON_BRANCH_NAME }}` (forked from `develop`)',
              '- The Vercel preview deploy for this PR is wired to this branch by the Neon-Vercel integration.',
              '',
              'This database is deleted automatically when the PR is closed.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const marker = '### 🌿 Neon preview branch ready';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  delete-branch:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
