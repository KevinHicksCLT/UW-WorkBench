# THE pipeline (refactor charter Tasks 7, 8, 20, 21) — one run per push,
# staged jobs, nothing deploys before its gates:
#
#   feature branch push:  quality ──► deploy-preview
#   develop/master push:  quality ──► migrate DB ──► deploy ──► smoke ──► neon-cleanup
#
# Vercel's direct git builds are disabled (vercel.json git.deploymentEnabled),
# so every deployment is produced by this pipeline, after green gates.
# Same-repo PRs show these checks via the branch's push run. Related but
# separate lifecycles: neon-preview-branches.yml (per-PR DB branch from
# develop, deleted on close).
#
# Secrets: NEON_API_KEY, NEON_PROJECT_ID, DEVELOP_DATABASE_URL,
# PRODUCTION_DATABASE_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET (smoke through deployment
# protection), SONAR_TOKEN + SONAR_ENABLED=true (hosted scan).
name: Pipeline

on:
  push:

concurrency:
  group: pipeline-${{ github.ref }}
  # Supersede in-flight runs on feature branches; never cancel a promotion.
  cancel-in-progress: ${{ github.ref_name != 'master' && github.ref_name != 'develop' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w cascade-backend
        env:
          # prisma generate does not connect; placeholder satisfies env validation.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build -w cascade-frontend

  # SonarCloud job intentionally absent until the account is configured — an
  # always-skipped job is a permanent noise row in every merge box. To enable:
  # restore the job from git history (SonarSource/sonarqube-scan-action@v5,
  # gated on vars.SONAR_ENABLED) after adding SONAR_TOKEN. Sonar's rule engine
  # (eslint-plugin-sonarjs) already runs inside the lint gate regardless.

  # ─── Feature branches: preview deploy AFTER gates ─────────────────────────
  deploy-preview:
    needs: quality
    if: ${{ vars.VERCEL_CI_DEPLOY == 'true' && github.ref_name != 'master' && github.ref_name != 'develop' }}
    runs-on: ubuntu-latest
    # vercel deploy once hung silently for the full 6h runner limit (run
    # 31315307095) — cap the job so a stuck CLI fails fast instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure the feature's Neon DB branch (forked from develop)
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          node scripts/neon-ensure-branch.mjs "${{ github.ref_name }}" > db.env
          # Mask + expose the connection strings for the migrate + deploy steps.
          while IFS='=' read -r k v; do
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < db.env
      - name: Install dependencies
        run: npm ci
      # Apply pending migrations to the feature's OWN Neon branch before the
      # preview deploys, so the preview's schema always matches the branch's
      # code (otherwise a new column added on the branch 500s until merge —
      # the feature branch forks develop's schema, which lacks it). Scoped to
      # this feature branch's own connection strings; never touches
      # develop/production (that stays the migrate job on develop/master).
      - name: Apply migrations to the feature's Neon branch
        working-directory: backend
        env:
          DATABASE_URL: ${{ steps.db.outputs.DIRECT_URL }}
          DIRECT_URL: ${{ steps.db.outputs.DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Deploy preview to Vercel (post-gate)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          # The preview runs against the feature's own Neon branch (forked from
          # develop) — deployment-scoped env, no project-level settings touched.
          # Vercel CANCELS builds its Ignored Build Step deems skippable (e.g.
          # a scripts/docs-only branch touches nothing deployable) and the CLI
          # exits 1 for them — that is a skip, not a failure. Real build
          # errors still fail the job.
          set +e
          out=$(npx vercel deploy --token="$VERCEL_TOKEN" \
            --env DATABASE_URL="${{ steps.db.outputs.POOLED_URL }}" \
            --env DIRECT_URL="${{ steps.db.outputs.DIRECT_URL }}" 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -q "The deployment has been canceled"; then
              echo "Preview skipped: Vercel canceled the build (no deployable changes on this branch)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit $code
          fi
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          echo "Preview deployed after green gates: $url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  # ─── develop/master: data-promote? → migrate → deploy → smoke → cleanup ───
  data-promote:
    # Whole-DATASET promotion as a LOGICAL COPY (pg_dump/pg_restore) — never a
    # Neon branch restore, which re-parents environment branches under feature
    # branches and welds an undeletable lineage chain. Branch parentage never
    # changes here; the target is snapshotted to a leaf-deletable
    # backup/<target>-<sha> child first, and one backup per target is kept.
    # Policy: feature -> develop promotes AUTOMATICALLY on every PR merge whose
    # feature has a same-name Neon branch; develop -> production stays opt-in
    # (merge TITLE must end with `[promote-data]`).
    needs: quality
    if: ${{ github.ref_name == 'master' || github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client (matches Neon server major)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version
      - name: Promote dataset if the merge requests it
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          DEVELOP_DIRECT_URL: ${{ secrets.DEVELOP_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          PATH="/usr/lib/postgresql/18/bin:$PATH" node scripts/neon-data-promote.mjs

  migrate:
    needs: data-promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to the target Neon branch
        working-directory: backend
        env:
          DATABASE_URL: ${{ github.ref_name == 'master' && secrets.PRODUCTION_DATABASE_URL || secrets.DEVELOP_DATABASE_URL }}
          DIRECT_URL: ${{ github.ref_name == 'master' && secrets.PRODUCTION_DATABASE_URL || secrets.DEVELOP_DATABASE_URL }}
        run: npx prisma migrate deploy

      # Seed RBAC config data (permission sets + legacy admin-token
      # normalisation) so entitlements travel with the schema to develop and
      # production. Idempotent and writes ONLY through the target DATABASE_URL —
      # no Neon branch operations, so it cannot re-parent branches or deadlock
      # the lineage. Bulk datasets remain the domain of the [promote-data] job.
      - name: Seed entitlements (config data) into the target Neon branch
        working-directory: backend
        env:
          DATABASE_URL: ${{ github.ref_name == 'master' && secrets.PRODUCTION_DATABASE_URL || secrets.DEVELOP_DATABASE_URL }}
          DIRECT_URL: ${{ github.ref_name == 'master' && secrets.PRODUCTION_DATABASE_URL || secrets.DEVELOP_DATABASE_URL }}
        run: npm run db:seed:entitlements

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Vercel (post-gate, post-migration)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          env_flag="--environment=preview"
          prod_flag=""
          if [ "${{ github.ref_name }}" = "master" ]; then
            env_flag="--environment=production"
            prod_flag="--prod"
          fi
          npx vercel pull --yes $env_flag --token="$VERCEL_TOKEN"
          # URL arrives on stdout; CLI hints go to stderr — don't merge them.
          url=$(npx vercel deploy $prod_flag --token="$VERCEL_TOKEN")
          echo "Deployed after green gates + migrations: $url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-check the deployment
        env:
          TARGET_URL: ${{ github.ref_name == 'master' && 'https://transform-platform.vercel.app' || 'https://transform-platform-git-develop-kevins-projects-e3a4abb1.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/deploy-smoke.mjs "$TARGET_URL"

  neon-cleanup:
    # After a feature merges to develop, delete its same-name Neon DB branch.
    # (Per-PR preview/pr-N branches are handled by neon-preview-branches.yml.)
    if: ${{ github.ref_name == 'develop' }}
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the merged feature's Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: node scripts/neon-branch-cleanup.mjs
