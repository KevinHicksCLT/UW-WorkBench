# SonarCloud project configuration (used by the optional CI job — see
# .github/workflows/ci.yml). Local static analysis is covered by
# eslint-plugin-sonarjs, which runs in the standard lint gate.
sonar.projectKey=KevinHicksCLT_transform-platform
sonar.organization=kevinhicksclt
sonar.sources=backend/src,frontend/src,shared
sonar.tests=e2e,backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,documents/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
